[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "hyra-flood-platform"
version = "0.1.0"
description = "Evidence-aware flood backend and rescue research interfaces"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
[tool.setuptools.packages.find]
where = ["src"]
